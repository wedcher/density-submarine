<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密度小艇｜教師管理</title>
<style>body{font:18px/1.6 sans-serif;margin:24px;background:#f5f8fa;color:#243139}button,input,select{font:inherit;margin:6px;padding:8px}section{background:white;padding:18px;margin:16px 0;border-radius:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}article{background:white;border:1px solid #ccc;border-radius:10px;padding:12px}canvas{width:100%;height:auto}.preview-button{display:block;width:100%;padding:0;margin:0}.preview-dialog{width:min(1100px,90vw)}#adminUrl{width:min(90%,900px)}[hidden]{display:none!important}</style>
<h1>密度小艇｜教師管理</h1><nav><button id="settingsTab">遊戲設定</button><button id="levelsTab">投稿管理</button></nav><p id="status" role="status"></p>
<section id="settings"><h2>遊戲設定</h2><label><input type="checkbox" id="likes">啟用按讚</label><p>教師專用部署網址（結尾加上 ?admin=1）</p><input id="adminUrl" aria-label="教師專用部署網址" type="url"><button id="save">儲存設定</button></section>
<section id="moderation"><h2>投稿管理</h2><input id="search" placeholder="搜尋關卡或作者" aria-label="搜尋關卡或作者"><select id="filter" aria-label="顯示範圍"><option value="all">全部</option><option value="public">公開</option><option value="hidden">已隱藏</option></select><button id="refresh">重新整理</button><label><input type="checkbox" id="selectAll">全選目前結果</label><p><button data-action="hide">隱藏勾選</button><button data-action="restore">恢復勾選</button><button data-action="delete">永久刪除勾選</button></p><div id="cards" class="cards"></div></section>
<script>
/*PREVIEW*/
const el=id=>document.getElementById(id);let entries=[],busy=false;const selected=new Set();
function rpc(action,payload){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(result=>{if(!result?.ok)reject(Error(result?.message||'操作失敗'));else resolve(result);}).withFailureHandler(error=>reject(Error(error.message||'連線失敗')))[action](payload);});}
async function perform(task){if(busy)return;busy=true;document.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);el('status').textContent='處理中…';try{await task();el('status').textContent='已完成';}catch(e){el('status').textContent=e.message;}finally{busy=false;document.querySelectorAll('button,input,select').forEach(e=>e.disabled=false);}}
function visible(){const q=el('search').value.toLowerCase(),filter=el('filter').value;return entries.filter(e=>(e.name+' '+e.author).toLowerCase().includes(q)&&(filter==='all'||e.hidden===(filter==='hidden')));}
function render(){el('cards').replaceChildren();el('selectAll').checked=false;for(const entry of visible()){const card=document.createElement('article'),check=document.createElement('input');check.type='checkbox';check.checked=selected.has(entry.id);check.setAttribute('aria-label','選取 '+entry.name);check.onchange=()=>check.checked?selected.add(entry.id):selected.delete(entry.id);const title=document.createElement('strong');title.textContent=entry.name;const meta=document.createElement('p');meta.textContent=entry.author+' ｜ '+entry.createdAt+' ｜ 👍 '+entry.likeCount+' ｜ '+(entry.hidden?'已隱藏':'公開');card.append(check,title,meta,levelPreviewButton(entry.preview,entry.name));el('cards').append(card);}}
async function load(){const result=await rpc('adminList');entries=result.levels;selected.clear();el('likes').checked=result.likesEnabled;el('adminUrl').value=result.adminUrl;render();}
el('settingsTab').onclick=()=>{el('settings').hidden=false;el('moderation').hidden=true;};el('levelsTab').onclick=()=>{el('settings').hidden=true;el('moderation').hidden=false;};
el('save').onclick=()=>perform(async()=>{await rpc('adminSettings',{likesEnabled:el('likes').checked,adminUrl:el('adminUrl').value.trim()});});
el('refresh').onclick=()=>perform(load);el('search').oninput=render;el('filter').onchange=render;el('selectAll').onchange=()=>{for(const entry of visible())el('selectAll').checked?selected.add(entry.id):selected.delete(entry.id);render();};
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{const ids=[...selected];if(!ids.length){el('status').textContent='請先勾選投稿。';return;}if(button.dataset.action==='delete'&&!confirm('永久刪除 '+ids.length+' 筆投稿及其按讚紀錄？此操作無法復原。'))return;perform(async()=>{await rpc('adminModerate',{ids,action:button.dataset.action});await load();});});
perform(load);
</script></html>
