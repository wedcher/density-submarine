<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>密度小艇｜地圖編輯器 v2</title>
<style>
:root{--ink:#243139;--paper:#f3f0e8;--rock1:#716557;--rock2:#4f473e;--l025:#e1f6ef;--l050:#d7ecf6;--l100:#e6def4;--l200:#f1d5dc}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
.wrap{width:1050px;max-width:calc(100vw - 24px);margin:16px auto}
.header{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap}h1{margin:0;font-size:24px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{border:2px solid var(--ink);background:white;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}
button.active{background:var(--ink);color:white}.levelGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:10px}
.levelGrid button{padding:6px 3px;font-size:12px;min-width:0}
.hud{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 13px;background:#fffdfa;border:2px solid #d7d0c5;border-radius:13px;margin-bottom:9px;font-weight:800}
.massDots{letter-spacing:5px;font-size:21px}.stageWrap{overflow:auto}
#stage{position:relative;width:1000px;height:600px;overflow:hidden;border:3px solid var(--ink);border-radius:16px;background:white}
.layer{position:absolute;left:0;width:1000px;height:130px;overflow:hidden}.layer .dots{position:absolute;inset:0;opacity:.48}.layer .tag{position:absolute;left:14px;top:9px;font-weight:900;z-index:2}
#L025{top:40px;background:var(--l025)}#L050{top:170px;background:var(--l050)}#L100{top:300px;background:var(--l100)}#L200{top:430px;background:var(--l200)}
.rock{position:absolute;z-index:5;background:radial-gradient(circle at 16px 13px,#918370 0 3px,transparent 3.5px) 0 0/40px 29px,linear-gradient(var(--rock1),var(--rock2));border:2px solid #403a34;border-radius:6px}
#goal{position:absolute;width:58px;height:68px;z-index:8}.flagpole{position:absolute;left:10px;top:0;width:4px;height:60px;background:var(--ink)}.flag{position:absolute;left:14px;top:1px;width:34px;height:23px;background:#efc94d;clip-path:polygon(0 0,100% 50%,0 100%)}.goalbase{position:absolute;left:2px;bottom:0;width:20px;height:10px;border:3px solid var(--ink);border-radius:50%;background:white}
.item{position:absolute;z-index:9;width:44px;height:44px;border:3px solid var(--ink);border-radius:11px;background:#f4d565;display:flex;align-items:center;justify-content:center;font-weight:900}
#boat{position:absolute;z-index:20;transform:translate(-50%,-50%);transition:left .08s linear,top .08s linear,width .12s ease,height .12s ease}.hull{position:absolute;inset:0;border:4px solid var(--ink);border-radius:14px;overflow:hidden}.hullDots{position:absolute;inset:0}
.formulaCard{position:absolute;z-index:30;left:50%;bottom:calc(100% + 10px);width:286px;height:92px;transform:translateX(-50%);border:2px solid rgba(38,50,58,.25);border-radius:14px;background:rgba(255,255,255,.80);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;gap:12px;font-family:Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums}.lhs,.eq{font-size:34px;font-weight:700}.frac{display:grid;grid-template-rows:auto 4px auto;justify-items:center;min-width:114px}.num,.den{font-size:31px;font-weight:700;line-height:1.02}.bar{width:100%;height:4px;background:#172229}
.periscope{position:absolute;z-index:22;left:50%;top:-13px;width:14px;height:15px;border-left:4px solid var(--ink);border-top:4px solid var(--ink);border-radius:6px 0 0 0}.propeller{position:absolute;z-index:22;left:-15px;top:50%;width:13px;height:4px;background:var(--ink)}
.massDrop{position:absolute;z-index:40;width:16px;height:16px;border-radius:50%;background:#202020;animation:fall .55s ease-in forwards}@keyframes fall{to{opacity:0;transform:translateY(58px) scale(.65)}}
.controls{margin-top:11px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:#fffdfa;border:2px solid #d7d0c5;border-radius:14px;padding:10px}.group{display:flex;gap:7px;flex-wrap:wrap}.group.right{justify-content:flex-end}.move{font-size:19px;min-width:45px}
.readout{text-align:center;min-width:260px}.readout b{font-size:18px}.sub{font-size:13px;opacity:.72;margin-top:3px}.msg{text-align:center;min-height:25px;font-weight:800;margin-top:8px}
.answer{margin-top:8px;padding:10px 12px;background:#fffdfa;border:2px dashed #bfb6a8;border-radius:12px;display:none;font-weight:700}
.note{font-size:12px;opacity:.68;text-align:center;margin-top:4px}
@media(max-width:760px){.levelGrid{grid-template-columns:repeat(5,1fr)}.controls{grid-template-columns:1fr}.group,.group.right{justify-content:center}.readout{order:-1}}

#stage{width:1000px;height:560px;border:0;border-radius:0;transform-origin:top left;touch-action:none}
.stageWrap{width:1000px;max-width:100%;margin:auto;overflow:hidden;outline:3px solid var(--ink);border-radius:8px}
.layer{height:120px}#L025{top:40px}#L050{top:160px}#L100{top:280px}#L200{top:400px}
#stage.editing{cursor:crosshair}#stage.editing:after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;background:linear-gradient(to right,#24313930 1px,transparent 1px),linear-gradient(to bottom,#24313930 1px,transparent 1px);background-size:40px 40px}
#boat{transition:none}.formulaCard{width:230px;height:64px;gap:7px;bottom:calc(100% + 4px)}.lhs,.eq{font-size:24px}.num,.den{font-size:22px}.frac{min-width:70px}.periscope,.propeller{display:none}
.item{width:40px;height:40px;border-radius:6px}.item.door{background:#997352;color:white}.item.open{opacity:.25;border-style:dashed}.item.key{background:#ffe795}
#goal{width:40px;height:40px}.flagpole{height:35px}.goalbase{height:7px}.controls button:disabled{opacity:.4;cursor:default}
#doodleCanvas{position:absolute;inset:0;z-index:50;pointer-events:none;width:1000px;height:560px}
#doodleCanvas.drawing{pointer-events:auto;cursor:crosshair;touch-action:none}
#stage.half-grid:after{background-size:40px 20px}
.toolbar label{align-self:center;font-size:14px}
.compact-toolbar{gap:6px;align-items:center;margin:7px 0}.compact-toolbar button{flex-shrink:0;white-space:nowrap;padding:8px 10px}
.tool-group{display:contents}.toolbar-hint{font-size:12px;white-space:nowrap;opacity:.75}
.level-name{display:flex;align-items:center;white-space:nowrap;gap:4px}
#levelName{width:190px;max-width:55vw;min-width:120px;padding:7px 9px;border:2px solid #bfb6a8;border-radius:8px;font:inherit;background:#fff}
#modeLabel{font-size:13px;white-space:nowrap}
#completionBadge{position:absolute;z-index:50;top:45px;left:50%;transform:translateX(-50%);padding:12px 26px;border:3px solid #8c6200;border-radius:16px;background:#ffe479;color:#493200;font-size:28px;font-weight:bold;pointer-events:none;animation:winBadge .55s ease-out}
#completionBadge[hidden]{display:none}.celebrate .hull{animation:winGlow .6s ease-in-out 3}
@keyframes winBadge{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes winGlow{50%{filter:brightness(1.5);box-shadow:0 0 22px 8px #ffd44b}}
@media(prefers-reduced-motion:reduce){#completionBadge,.celebrate .hull{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><h1>密度小艇｜地圖編輯器 v2</h1><div>先選工具，再點格子放置；岩石與橡皮擦可拖曳</div></div>
<div class="toolbar compact-toolbar" id="materialRow">
<div id="tools" class="tool-group" aria-label="正式關卡工具"></div>
<div id="doodleTools" class="tool-group" aria-label="規畫塗鴉工具"><button id="doodlePen">塗鴉筆</button><button id="doodleErase">塗鴉橡皮擦</button><button id="doodleClear">清空塗鴉</button><span class="toolbar-hint">塗鴉不匯出，試玩時暫時隱藏。</span></div>
</div>
<div class="toolbar compact-toolbar" id="levelRow">
<label class="level-name">關卡名稱：<input id="levelName" type="text" maxlength="120" placeholder="未命名關卡" autocomplete="off"></label>
<button id="exportBtn">匯出關卡</button><button id="importBtn">匯入關卡</button><input id="importFile" type="file" accept=".json,application/json" hidden>
<button id="clearBtn">清空</button><button id="modeBtn">試玩</button><button id="restartBtn" hidden>重新試玩</button><span id="modeLabel">編輯模式｜每格 40 × 40</span>
</div>
<div class="hud"><div>質量 M：<span class="massDots" id="massDots"></span></div><div id="hudStatus"></div></div>
<div class="stageWrap"><div id="stage">
<div class="layer" id="L025"><div class="dots"></div><div class="tag">D = 0.25</div></div>
<div class="layer" id="L050"><div class="dots"></div><div class="tag">D = 0.5</div></div>
<div class="layer" id="L100"><div class="dots"></div><div class="tag">D = 1</div></div>
<div class="layer" id="L200"><div class="dots"></div><div class="tag">D = 2</div></div>
<canvas id="doodleCanvas" width="1000" height="560" aria-label="規畫塗鴉圖層"></canvas>
<div id="rockLayer"></div><div id="itemLayer"></div>
<div id="goal"><div class="flagpole"></div><div class="flag"></div><div class="goalbase"></div></div>
<div id="boat"><div class="formulaCard"><span class="lhs" id="fD"></span><span class="eq">=</span><span class="frac"><span class="num" id="fM"></span><span class="bar"></span><span class="den" id="fV"></span></span></div><div class="periscope"></div><div class="propeller"></div><div class="hull"><div class="hullDots"></div></div></div>
</div></div>
<div class="controls">
<div class="group"><button class="move" id="left">←</button><button class="move" id="up">↑</button><button class="move" id="down">↓</button><button class="move" id="right">→</button></div>
<div class="readout"><b id="densityText"></b><div class="sub" id="stateText"></div></div>
<div class="group right"><button id="vPlus">V＋</button><button id="vMinus">V－</button><button id="mMinus">丟 M</button></div>
</div>
<div class="msg" id="msg"></div><div class="answer" id="answer"></div>
<div class="note">← → 移動；↑ ↓ 在相同密度層內移動；Num ＋／－ 改 V；Num ＊ 丟 M。通道依當下船身尺寸判定；投稿前須自行通關。新關卡初始 M=1、V=1，匯入時沿用檔案設定。半格岩石為 1 格寬 × 0.5 格高，依點擊位置對齊上／下半格；小艇仍需 1 格高的通道。</div>
</div>
<script>
const densityStyles={
 '0.25':{bg:'#e1f6ef',dot:'#4f9b88'},
 '0.5': {bg:'#d7ecf6',dot:'#4f89a6'},
 '0.75':{bg:'#dcdff3',dot:'#5d79a8'},
 '1':   {bg:'#e6def4',dot:'#7564a3'},
 '1.5': {bg:'#ead8e7',dot:'#91647f'},
 '2':   {bg:'#f1d5dc',dot:'#a55d72'},
 '3':   {bg:'#e8c2c8',dot:'#873f52'}
};


const CELL=40,COLS=25,ROWS=14,WIDTH=1000,HEIGHT=560;
const layerDefs=[{d:.25,top:40,bottom:160},{d:.5,top:160,bottom:280},{d:1,top:280,bottom:400},{d:2,top:400,bottom:520}];
const $=id=>document.getElementById(id);
const stage=$('stage'),boat=$('boat'),goal=$('goal'),msg=$('msg');
let map=Array.from({length:ROWS},()=>Array(COLS).fill(null)),mode='edit',tool='rock',state=null,rocks=[],items=[],goalPos=null,drawing=false,lastCell=null;
// Half rocks use integer half-row coordinates; the original full-cell map stays intact.
let halfRocks=[],initial={m:1,v:1};
function size(v){return {w:CELL*v/2,h:CELL}}
function fmt(n){return Number.isInteger(n)?n.toFixed(1):String(n)}
function D(){return state.m/state.v}
function honey(el,d,color,op=.5){const gap=20/Math.sqrt(d);Object.assign(el.style,{opacity:op,backgroundImage:`radial-gradient(circle,${color} 0 2.4px,transparent 2.8px),radial-gradient(circle,${color} 0 2.4px,transparent 2.8px)`,backgroundSize:`${gap}px ${gap}px`,backgroundPosition:`0 0,${gap/2}px ${gap/2}px`})}
['L025','L050','L100','L200'].forEach((id,i)=>honey($(id).querySelector('.dots'),layerDefs[i].d,densityStyles[String(layerDefs[i].d)].dot));
function bounds(d){const l=layerDefs.find(l=>l.d===d);if(l)return [l.top+20,l.bottom-20];const y=d===.75?280:d===1.5?400:500;return [y,y]}
function solidBlocked(x,y,v=state.v){const s=size(v);return x-s.w/2<0||x+s.w/2>WIDTH||y-20<40||y+20>520||rocks.some(r=>x-s.w/2<r.x+r.w&&x+s.w/2>r.x&&y-20<r.y+r.h&&y+20>r.y)}
function blocked(x,y,v=state.v){return solidBlocked(x,y,v)||items.some(it=>it.type==='door'&&!it.open&&overlap(x,y,size(v).w,it.x,it.y,40))}
function openDoorsAt(x,y){
 if(solidBlocked(x,y))return;
 for(const door of items){
  if(door.type!=='door'||door.open||!state.key||!overlap(x,y,size(state.v).w,door.x,door.y,40))continue;
  const group=[door],seen=new Set(group);
  for(let i=0;i<group.length;i++)for(const other of items)if(other.type==='door'&&!seen.has(other)&&Math.abs(other.x-group[i].x)+Math.abs(other.y-group[i].y)===CELL){seen.add(other);group.push(other)}
  state.key--;for(const member of group)member.open=true;
  msg.textContent='已使用一把鑰匙開門，剩餘 '+state.key+' 把。';drawWorld();
 }
}
function overlap(x,y,w,ix,iy,iw){return Math.abs(x-ix)<(w+iw)/2&&Math.abs(y-iy)<40}
function rect(parent,cls,x,y,w,h,text=''){const e=document.createElement('div');e.className=cls;e.textContent=text;Object.assign(e.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});parent.appendChild(e);return e}
function drawWorld(){ $('rockLayer').innerHTML='';rocks.forEach(r=>rect($('rockLayer'),'rock',r.x,r.y,r.w,r.h));$('itemLayer').innerHTML='';items.filter(i=>!i.taken).forEach(i=>rect($('itemLayer'),'item '+i.type+(i.type==='door'&&i.open?' open':''),i.x-20,i.y-20,40,40,i.type==='mass'?'M+':i.type==='key'?'鑰匙':i.open?'開':'門'));goal.hidden=!goalPos;if(goalPos){goal.style.left=goalPos.x-20+'px';goal.style.top=goalPos.y-20+'px'}}
function build(){resetKeyboardMotion();boat.classList.remove('celebrate');if($('completionBadge'))$('completionBadge').hidden=true;rocks=[{x:0,y:0,w:1000,h:40},{x:0,y:520,w:1000,h:40}];items=[];goalPos=null;state=null;map.forEach((row,r)=>row.forEach((type,c)=>{const x=c*40+20,y=r*40+20;if(type==='rock')rocks.push({x:x-20,y:y-20,w:40,h:40});else if(type==='boat')state={x,y,m:initial.m,v:initial.v,key:0,won:false};else if(type==='goal')goalPos={x,y};else if(type)items.push({type,x,y,taken:false})}));halfRocks.forEach(r=>rocks.push({x:r.column*CELL,y:r.halfRow*(CELL/2),w:CELL,h:CELL/2}));drawWorld();render()}
function render(){boat.hidden=!state;document.querySelectorAll('.controls button').forEach(b=>b.disabled=mode!=='play'||state?.won);if(!state){$('hudStatus').textContent='請放置一個小艇與終點';$('massDots').textContent='';$('densityText').textContent='D = M / V';$('stateText').textContent='';return}const d=D(),s=size(state.v),sty=densityStyles[String(d)];Object.assign(boat.style,{left:state.x+'px',top:state.y+'px',width:s.w+'px',height:s.h+'px'});document.querySelector('.hull').style.backgroundColor=sty.bg;honey(document.querySelector('.hullDots'),d,sty.dot,.68);const card=document.querySelector('.formulaCard');card.style.left=Math.max(118,Math.min(882,state.x))-state.x+'px';card.style.bottom=state.y<110?'auto':'calc(100% + 4px)';card.style.top=state.y<110?'calc(100% + 4px)':'auto';$('fD').textContent='D('+fmt(d)+')';$('fM').textContent='M('+state.m+')';$('fV').textContent='V('+state.v+')';$('massDots').textContent='●'.repeat(state.m);$('hudStatus').textContent=`M=${state.m}　V=${state.v}　D=${fmt(d)}　鑰匙：${state.key} 把`;$('densityText').textContent='D = '+fmt(d);const [lo,hi]=bounds(d);$('stateText').textContent=(lo!==hi?'可在 D='+fmt(d)+' 液體層內上下移動':d===3?'沉在底部':'沿兩層交界活動')+(state.y<lo||state.y>hi?'｜正往目標浮沉；岩石仍會阻擋':'')}
// All M/V changes are transactional; resolve collisions in connected nearby water.
// Reposition only inside the new density region, or horizontally while in transit.
function changeStats(m,v){
 const next={...state,m,v},d=m/v,s=size(v);let position={x:state.x,y:state.y};
 if(blocked(state.x,state.y,v)){
  const [lo,hi]=bounds(d),inRegion=state.y>=lo&&state.y<=hi;
  const queue=[[0,0]],seen=new Set(['0,0']);let best=null,bestDistance=Infinity;
  // Search connected nearby water using the old hull. Never jump through rock.
  for(let index=0;index<queue.length;index++){
   const [dx,dy]=queue[index],distance=dx*dx+dy*dy,x=state.x+dx,y=state.y+dy;
   if(distance<bestDistance&&!blocked(x,y,v)){best={x,y};bestDistance=distance}
   for(const [sx,sy] of [[-1,0],[1,0],[0,-1],[0,1]]){
    const nx=dx+sx,ny=dy+sy,key=nx+','+ny,py=state.y+ny;
    if(seen.has(key)||nx*nx+ny*ny>s.w*s.w||(!inRegion&&ny!==0)||(inRegion&&(py<lo||py>hi)))continue;
    seen.add(key);if(!blocked(state.x+nx,py,state.v))queue.push([nx,ny]);
   }
  }
  if(!best){msg.textContent='空間不足，無法改變 V；請先移到較寬的位置。';return false}
  position=best;
 }
 Object.assign(next,position);state=next;render();return true;
}
function active(){return mode==='play'&&state&&!state.won}
function step(dx,dy){const steps=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy)));for(let i=0;i<steps;i++){const x=state.x+dx/steps,y=state.y+dy/steps;openDoorsAt(x,y);if(blocked(x,y))break;state.x=x;state.y=y;const before=D();collect();if(state.won||D()!==before)break}}
function finish(){if(!state.won&&goalPos&&overlap(state.x,state.y,size(state.v).w,goalPos.x,goalPos.y,40)){state.won=true;resetKeyboardMotion();boat.classList.add('celebrate');if(!$('completionBadge')){const badge=document.createElement('div');badge.id='completionBadge';badge.setAttribute('role','status');stage.appendChild(badge)}$('completionBadge').textContent='★ 挑戰成功！ ★';$('completionBadge').hidden=false;msg.textContent='過關！可回編輯繼續修改地圖。'}}
function collect(){for(const it of items){if(it.taken||it.type==='door'||!overlap(state.x,state.y,size(state.v).w,it.x,it.y,40))continue;if(it.type==='key'){it.taken=true;state.key++;msg.textContent='已取得鑰匙，目前持有 '+state.key+' 把；碰到門才會開啟。'}else if(state.m<3&&changeStats(state.m+1,state.v)){it.taken=true}drawWorld()}finish()}
// A one-cell opening must remain reachable with 24/16 px button increments.
// Correct only a small perpendicular offset; test both swept paths, never shrink the hull.
function clearPath(x,y,dx,dy){
 const n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy)));
 for(let i=1;i<=n;i++)if(blocked(x+dx*i/n,y+dy*i/n))return false;
 return true;
}
function moveThroughOpening(dx,dy){
 const start={x:state.x,y:state.y,d:D()},horizontal=dx!==0;
 step(dx,dy);
 if(state.won||D()!==start.d)return;
 const remaining=horizontal?start.x+dx-state.x:start.y+dy-state.y;
 if(Math.abs(remaining)<1e-8)return;
 const [lo,hi]=bounds(D()),limit=horizontal?8:12;
 for(let offset=1;offset<=limit;offset++)for(const sign of [-1,1]){
  const ax=horizontal?0:offset*sign,ay=horizontal?offset*sign:0;
  const x=state.x+ax,y=state.y+ay,rx=horizontal?remaining:0,ry=horizontal?0:remaining;
  if(y<lo||y>hi||!clearPath(state.x,state.y,ax,ay)||!clearPath(x,y,rx,ry))continue;
  step(ax,ay);
  if(!state.won&&D()===start.d)step(rx,ry);
  return;
 }
}
function moveX(dx){if(!active())return;moveThroughOpening(dx,0);collect();render()}
function moveY(dir){if(!active())return;const [lo,hi]=bounds(D());if(lo===hi||state.y<lo||state.y>hi)return;moveThroughOpening(0,Math.max(lo,Math.min(hi,state.y+dir*16))-state.y);collect();render()}
function buoy(){if(!active())return;const [lo,hi]=bounds(D()),target=Math.max(lo,Math.min(hi,state.y));step(0,Math.sign(target-state.y)*Math.min(6,Math.abs(target-state.y)));collect();render()}
function changeV(up){if(!active())return;const vals=[1,2,4],v=vals[vals.indexOf(state.v)+(up?1:-1)];if(v)changeStats(state.m,v)}
function dropM(){if(active()&&state.m>1)changeStats(state.m-1,state.v)}
function paint(c,r,halfRow=r*2){
 if(mode!=='edit'||c<0||c>=COLS||r<=0||r>=ROWS-1)return;
 if(tool==='boat'||tool==='goal')map.forEach(row=>row.forEach((v,i)=>{if(v===tool)row[i]=null}));
 if(tool==='halfRock'){
  map[r][c]=null;

function pointAt(e){const b=stage.getBoundingClientRect();return {x:(e.clientX-b.left)*WIDTH/b.width,y:(e.clientY-b.top)*HEIGHT/b.height}}

// Versioned formal level format. Coordinates are logical grid units, never pixels.
const FORMAT='density-submarine-level',RULES='density-lock-v1';
function levelData(){
 const data={name:$('levelName').value,format:FORMAT,version:1,rules:RULES,grid:{columns:COLS,rows:ROWS,cellPixels:CELL,halfRowsPerCell:2,fixedRockRows:[0,13]},liquids:layerDefs.map(l=>({density:l.d,topHalfRow:l.top/20,bottomHalfRow:l.bottom/20})),initial:{...initial},start:null,goal:null,rocks:[],items:[]};
 map.forEach((row,r)=>row.forEach((type,c)=>{const cell={column:c,row:r};if(type==='rock')data.rocks.push({column:c,halfRow:r*2,widthCells:1,heightHalfRows:2});else if(type==='boat')data.start=cell;else if(type==='goal')data.goal=cell;else if(type)data.items.push({type,...cell})}));
 halfRocks.forEach(h=>data.rocks.push({...h,widthCells:1,heightHalfRows:1}));
 data.rocks.sort((a,b)=>a.halfRow-b.halfRow||a.column-b.column);return data;
}
function validateLevel(data){
 const fail=()=>{throw Error('關卡格式或資料不正確，未匯入。')};
 const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
 const keys=(v,list)=>object(v)&&Object.keys(v).length===list.length&&list.every(k=>Object.hasOwn(v,k));
 const hasName=object(data)&&Object.hasOwn(data,'name');
 if(hasName&&(typeof data.name!=='string'||data.name.length>120))fail();
 if(!keys(data,[...(hasName?['name']:[]),'format','version','rules','grid','liquids','initial','start','goal','rocks','items'])||data.format!==FORMAT||data.version!==1||data.rules!==RULES)fail();
 const expected=levelData();
 if(!keys(data.grid,Object.keys(expected.grid))||!['columns','rows','cellPixels','halfRowsPerCell'].every(k=>data.grid[k]===expected.grid[k])||JSON.stringify(data.grid.fixedRockRows)!=='[0,13]')fail();
 if(!Array.isArray(data.liquids)||data.liquids.length!==4||!data.liquids.every((l,i)=>keys(l,['density','topHalfRow','bottomHalfRow'])&&Object.keys(l).every(k=>l[k]===expected.liquids[i][k])))fail();
 if(!keys(data.initial,['m','v'])||![1,2,3].includes(data.initial.m)||![1,2,4].includes(data.initial.v))fail();
 if(!Array.isArray(data.rocks)||data.rocks.length>600||!Array.isArray(data.items)||data.items.length>300)fail();
 const nextMap=Array.from({length:ROWS},()=>Array(COLS).fill(null)),nextHalf=[],occupied=new Set();
 const reserve=(c,h,count)=>{if(!Number.isInteger(c)||c<0||c>=COLS||!Number.isInteger(h)||h<2||h+count>26)fail();for(let i=0;i<count;i++){const k=c+','+(h+i);if(occupied.has(k))fail();occupied.add(k)}};
 for(const r of data.rocks){if(!keys(r,['column','halfRow','widthCells','heightHalfRows'])||r.widthCells!==1||![1,2].includes(r.heightHalfRows)||(r.heightHalfRows===2&&r.halfRow%2!==0))fail();reserve(r.column,r.halfRow,r.heightHalfRows);if(r.heightHalfRows===2)nextMap[r.halfRow/2][r.column]='rock';else nextHalf.push({column:r.column,halfRow:r.halfRow})}
 const place=(pos,type,isItem=false)=>{if(!keys(pos,isItem?['type','column','row']:['column','row'])||!Number.isInteger(pos.row))fail();reserve(pos.column,pos.row*2,2);nextMap[pos.row][pos.column]=type};
 if(data.start!==null)place(data.start,'boat');if(data.goal!==null)place(data.goal,'goal');
 for(const i of data.items){if(!object(i)||!['mass','key','door'].includes(i.type))fail();place(i,i.type,true)}
 return {name:hasName?data.name:'',map:nextMap,halfRocks:nextHalf,initial:{m:data.initial.m,v:data.initial.v}};
}
function importLevelText(text){
 if(mode!=='edit')return false;
 try{if(text.length>200000)throw Error();const next=validateLevel(JSON.parse(text));map=next.map;halfRocks=next.halfRocks;initial=next.initial;$('levelName').value=next.name;build();msg.textContent='關卡已匯入；塗鴉保持不變。';return true}
 catch(e){msg.textContent='關卡格式或資料不正確，未匯入。';return false}
}
function exportFileName(name){
 let base=Array.from(name.trim().replace(/[<>:"/\\|?*\x00-\x1f\x7f]/g,'_').replace(/\.json$/i,'')).slice(0,100).join('').replace(/[.\s]+$/g,'');
 if(!base)base='density_level';
 if(/^(con|prn|aux|nul|com[1-9¹²³]|lpt[1-9¹²³])(?:\.|$)/i.test(base))base='_'+base;
 return base+'.json';
}
function downloadLevel(blob,fileName){
 const url=URL.createObjectURL(blob),a=document.createElement('a');

 msg.textContent='已交由瀏覽器下載（不含塗鴉）。若要選資料夾，請開啟瀏覽器「下載前詢問儲存位置」。';
}
$('exportBtn').onclick=async()=>{
 const blob=new Blob([JSON.stringify(levelData(),null,2)+'\n'],{type:'application/json'}),fileName=exportFileName($('levelName').value);
 if(typeof window.showSaveFilePicker!=='function'){downloadLevel(blob,fileName);return}
 const button=$('exportBtn');button.disabled=true;
 let writable;
 try{
  const handle=await window.showSaveFilePicker({id:'density-level-export',suggestedName:fileName,types:[{description:'密度小艇關卡 JSON',accept:{'application/json':['.json']}}]});
  writable=await handle.createWritable();await writable.write(blob);await writable.close();writable=null;
  msg.textContent='已儲存正式關卡 JSON 至選擇的位置（不含塗鴉）。';
 }catch(error){
  if(writable){try{await writable.abort()}catch{}}
  if(error.name==='AbortError')msg.textContent='已取消匯出，地圖保持不變。';
  else if(error.name==='SecurityError'||error.name==='NotSupportedError')downloadLevel(blob,fileName);
  else msg.textContent='儲存失敗，請重試並選擇可寫入的資料夾；地圖保持不變。';
 }finally{button.disabled=false}
};

// Keyboard-only coast: 160/110 px per second, ~13/9 px release travel.
const directionKeys=new Set();let keyboardVX=0,keyboardVY=0,keyboardFrame=0,keyboardTime=0;
function resetKeyboardMotion(){directionKeys.clear();keyboardVX=keyboardVY=keyboardTime=0;if(keyboardFrame)cancelAnimationFrame(keyboardFrame);keyboardFrame=0}
function keyboardAllowed(){return active()&&!document.querySelector('dialog[open]')&&!document.activeElement?.closest('input,textarea,select,[contenteditable]')}
function keyboardTick(time){
 keyboardFrame=0;if(!keyboardAllowed()){resetKeyboardMotion();return}
 const dt=keyboardTime?Math.min(.032,(time-keyboardTime)/1000):1/60;keyboardTime=time;
 const dx=Number(directionKeys.has('ArrowRight'))-Number(directionKeys.has('ArrowLeft')),dy=Number(directionKeys.has('ArrowDown'))-Number(directionKeys.has('ArrowUp'));
 keyboardVX=dx?dx*160:keyboardVX*Math.exp(-dt/.08);keyboardVY=dy?dy*110:keyboardVY*Math.exp(-dt/.08);
 if(Math.abs(keyboardVX)<3)keyboardVX=0;if(Math.abs(keyboardVY)<3)keyboardVY=0;
 if(keyboardVX)moveX(keyboardVX*dt);
 if(keyboardVY&&active()){const [lo,hi]=bounds(D());if(lo!==hi&&state.y>=lo&&state.y<=hi){moveThroughOpening(0,Math.max(lo,Math.min(hi,state.y+keyboardVY*dt))-state.y);collect();render()}else keyboardVY=0}
 if(active()&&(directionKeys.size||keyboardVX||keyboardVY))keyboardFrame=requestAnimationFrame(keyboardTick);else resetKeyboardMotion();
}
window.addEventListener('keydown',e=>{

 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();directionKeys.add(e.code);if(!keyboardFrame)keyboardFrame=requestAnimationFrame(keyboardTick);return}
 const action={NumpadAdd:()=>changeV(true),NumpadSubtract:()=>changeV(false),NumpadMultiply:dropM}[e.code];if(action){e.preventDefault();action()}
});
